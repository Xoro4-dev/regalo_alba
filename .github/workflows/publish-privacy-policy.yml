name: Publish privacy policy

on:
  push:
    branches: [main]
    paths:
      - "docs/privacy-policy.html"
      - ".github/workflows/publish-privacy-policy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare privacy policy page
        run: |
          if grep -q '\[AÑADIR ' docs/privacy-policy.html; then
            echo "Complete the privacy policy contact fields before publishing."
            exit 1
          fi
          mkdir public
          cp docs/privacy-policy.html public/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
